# The single-VM STAGING and rehearsal stack (docs/STAGING.md, docs/DEPLOY.md): Postgres inside the stack, without
# TLS, used with deploy/env.staging.example (DATABASE_SSL_MODE=disable, ALLOW_FAKE_PROVIDERS=true). Real teams use
# docker-compose.app-vm.yml instead, with the database on its own host over verified TLS (DEPLOY §3 "Database host",
# §12). Put a TLS-terminating proxy or load balancer in front of `web` (it serves the app and proxies /api).
#
#   cp deploy/env.staging.example .env.production       # the app's environment: fill in every value
#   cp deploy/env.owner.example .env.owner             # the database owner's credentials: fill in both
#   docker compose -f docker-compose.prod.yml --env-file .env.owner up -d --build
#
# Two files on purpose (DEPLOY §3): api, worker and release read only .env.production, which holds no owner
# credential; the owner's user, password and URL in .env.owner reach only the postgres service (its superuser) and
# the release step (migrations), by interpolation from --env-file. The API and the worker refuse to start in
# production with an owner credential in their environment.
#
# Order: postgres healthy → release (migrations as the OWNER role, aligns the app role) → api + worker → web.
name: realty

x-app: &app
  env_file: .env.production
  init: true
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_OWNER_USER:-realty_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set POSTGRES_OWNER_PASSWORD in .env.owner and pass --env-file .env.owner}
      POSTGRES_DB: ${POSTGRES_DB:-realty}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

  release:
    <<: *app
    build: { context: ., target: api }
    image: realty-api:latest
    restart: "no"
    command: ["node", "packages/db/dist/scripts/release.js"]
    environment:
      # the owner role, for the migrations of this one-off step only (never in .env.production)
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?set MIGRATION_DATABASE_URL in .env.owner and pass --env-file .env.owner}
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    image: realty-api:latest
    command: ["node", "apps/api/dist/main.js"]
    volumes:
      - storage:/var/lib/realty/storage   # STORAGE_PROVIDER=local (STORAGE_DIR=/var/lib/realty/storage); unused with s3
    stop_grace_period: 40s
    depends_on:
      release: { condition: service_completed_successfully }

  worker:
    <<: *app
    image: realty-api:latest
    command: ["node", "apps/api/dist/worker/main.js"]
    volumes:
      - storage:/var/lib/realty/storage
    environment:
      WORKER_HEALTH_PORT: "3002"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
    stop_grace_period: 40s
    depends_on:
      release: { condition: service_completed_successfully }

  web:
    build: { context: ., target: web }
    image: realty-web:latest
    restart: unless-stopped
    environment:
      API_UPSTREAM: api:3001
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  storage:
