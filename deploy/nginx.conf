# Serves the static web app and proxies /api to the API on the SAME origin, so session cookies are
# first-party exactly as in development (Vite proxies /api there). Put TLS in front of this (a load
# balancer or another proxy) and set TRUST_PROXY=true on the API. ${API_UPSTREAM} is filled in by the
# nginx image's envsubst at start-up. /etc/nginx/snippets/security-headers.conf is deploy/security-headers.conf
# (generated; the Dockerfile web stage copies it there).
# no query strings in access logs: reset/invite/unsubscribe tokens travel there
log_format combined_noquery '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';

server {
  listen 8080;
  access_log /var/log/nginx/access.log combined_noquery;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # webhooks (SendGrid Inbound Parse can post up to 10 MB) and imports
  client_max_body_size 11m;

  # Security headers (SECURITY §2.1): every location that serves the web app includes the generated
  # security-headers.conf (webSecurityHeaders from apps/web/security-headers.ts: the strict CSP with
  # frame-ancestors, nosniff, Referrer-Policy, Permissions-Policy, COOP, CORP, X-Frame-Options). There are
  # deliberately NO server-level add_header lines: nginx drops inherited add_header lines in any location that
  # sets its own, and /api/ must not inherit them (see there). apps/web/src/security-headers.nginx.test.ts
  # checks the effective header set of every location against webSecurityHeaders.

  location = /healthz {
    include /etc/nginx/snippets/security-headers.conf;
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # The API sends its own, stricter headers (helmet: deny-all CSP `default-src 'none'; frame-ancestors 'none'`,
  # nosniff, Referrer-Policy no-referrer, CORP, HSTS; apps/api/src/server.ts). nginx adds none here, so a
  # response never carries two conflicting CSPs. (nginx's own 502/504 page for an unreachable API has none.)
  # CORS is the API's alone: credential-less for /api/public/chat/ (module 22, each widget limited to its allowed
  # websites by the route) and the web origin elsewhere. nginx passes Access-Control-* and preflights through
  # unchanged: it adds, hides and answers none of them.
  location /api/ {
    # A variable upstream is re-resolved through the resolver (at most every 10 s), so a recreated api
    # container with a new address is found again; a literal one is resolved once at start-up and then 502s.
    # NGINX_RESOLVER is Docker's embedded DNS (127.0.0.11) in the web image; a bare-host nginx sets its own.
    resolver ${NGINX_RESOLVER} valid=10s ipv6=off;
    set $api_upstream http://${API_UPSTREAM};
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
  }

  # The website chat widget (module 37, built by vite.widget.config.ts into /widget/chat.js) is loaded by brokerages'
  # own websites with a plain <script src>, a cross-origin no-cors request: this one path sends
  # Cross-Origin-Resource-Policy: cross-origin (widget-security-headers.conf, generated from widgetScriptHeaders);
  # every other location stays same-origin. Its name is not hashed, so it is cached briefly and revalidated, and a
  # missing file is a 404, never the SPA's index.html (which nosniff would refuse to run anyway). The widget's calls
  # go to /api/public/chat/ below, where the API answers CORS itself.
  location = /widget/chat.js {
    add_header Cache-Control "public, max-age=300";
    include /etc/nginx/snippets/widget-security-headers.conf;
    try_files $uri =404;
  }

  # hashed assets are immutable; index.html never cached so a deploy is picked up at once
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  location / {
    # the SPA fallback is an internal redirect to /index.html, which this location serves with the same headers
    add_header Cache-Control "no-store";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
