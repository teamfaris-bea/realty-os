# Serves the static web app and proxies /api to the API on the SAME origin, so session cookies are
# first-party exactly as in development (Vite proxies /api there). Put TLS in front of this (a load
# balancer or another proxy) and set TRUST_PROXY=true on the API. ${API_UPSTREAM} is filled in by the
# nginx image's envsubst at start-up.
# no query strings in access logs: reset/invite/unsubscribe tokens travel there
log_format combined_noquery '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';

server {
  listen 8080;
  access_log /var/log/nginx/access.log combined_noquery;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # webhooks (SendGrid Inbound Parse can post up to 10 MB) and imports
  client_max_body_size 11m;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  location /api/ {
    proxy_pass http://${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
  }

  # hashed assets are immutable; index.html never cached so a deploy is picked up at once
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    try_files $uri $uri/ /index.html;
  }
}
