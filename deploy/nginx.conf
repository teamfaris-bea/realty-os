# Serves the static web app and proxies /api to the API on the SAME origin, so session cookies are
# first-party exactly as in development (Vite proxies /api there). Put TLS in front of this (a load
# balancer or another proxy) and set TRUST_PROXY on the API to this container's network (uniquelocal; DEPLOY §4).
# ${API_UPSTREAM} is filled in by the nginx image's envsubst at start-up. /etc/nginx/snippets/security-headers.conf
# is deploy/security-headers.conf (generated; the Dockerfile web stage copies it there).
#
# The access log carries no capability (finding chat-token-in-access-log): no query string (the reset link's token is
# in its fragment, which never reaches a server, but a query string can carry anything), and no secret path segment.
# A capability URL's secret is in its PATH and is the request's only authority: module 22's chat session token
# (/api/public/chat/session/<token>/poll, polled every few seconds while a chat is open), the RFC 8058 one-click
# unsubscribe ref (/api/email/unsubscribe/<ref>) and a lead source's intake token (/api/intake/<token>). The access
# log writes "-" in its place ($log_uri). The capture names are long on purpose: the image's envsubst fills in any
# ${NAME} that is an environment variable. apps/web/src/security-headers.nginx.test.ts checks both.
map $uri $log_uri {
  ~^(?<redact_head>/api/public/chat/session/)[^/]+(?<redact_tail>/.*)?$  "${redact_head}-${redact_tail}";
  ~^(?<redact_head>/api/email/unsubscribe/)[^/]+(?<redact_tail>/.*)?$     "${redact_head}-${redact_tail}";
  ~^(?<redact_head>/api/intake/)[^/]+(?<redact_tail>/.*)?$                "${redact_head}-${redact_tail}";
  default                                                                 $uri;
}
log_format combined_noquery '$remote_addr [$time_local] "$request_method $log_uri $server_protocol" $status $body_bytes_sent $request_time';

server {
  listen 8080;
  access_log /var/log/nginx/access.log combined_noquery;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # the client's address: believed from the load balancer's X-Forwarded-For only (deploy/real-ip.conf)
  include /etc/nginx/snippets/real-ip.conf;

  # webhooks (SendGrid Inbound Parse can post up to 10 MB) and imports
  client_max_body_size 11m;

  # Security headers (SECURITY §2.1): every location that serves the web app includes the generated
  # security-headers.conf (webSecurityHeaders from apps/web/security-headers.ts: the strict CSP with
  # frame-ancestors, nosniff, Referrer-Policy, Permissions-Policy, COOP, CORP, X-Frame-Options). There are
  # deliberately NO server-level add_header lines: nginx drops inherited add_header lines in any location that
  # sets its own, and /api/ must not inherit them (see there). apps/web/src/security-headers.nginx.test.ts
  # checks the effective header set of every location against webSecurityHeaders.

  location = /healthz {
    include /etc/nginx/snippets/security-headers.conf;
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # The API sends its own, stricter headers (helmet: deny-all CSP `default-src 'none'; frame-ancestors 'none'`,
  # nosniff, Referrer-Policy no-referrer, CORP, HSTS; apps/api/src/server.ts). nginx adds none here, so a
  # response never carries two conflicting CSPs. (nginx's own 502/504 page for an unreachable API has none.)
  # CORS is the API's alone: credential-less from any website for /api/public/chat/ (module 22; the widget's allowed
  # websites are enforced where the widget key is resolved, GET .../:widgetKey and .../start, while a chat's session
  # routes rely on its token alone) and the web origin with credentials elsewhere. nginx passes Access-Control-* and
  # preflights through unchanged: it adds, hides and answers none of them.
  # X-Forwarded-For is the client's address and nothing else ($remote_addr after real-ip.conf): a header the client
  # wrote is replaced, never appended to, so the API's per-IP limits count real clients (chat-xff-ratelimit-bypass).
  location /api/ {
    # A variable upstream is re-resolved through the resolver (at most every 10 s), so a recreated api
    # container with a new address is found again; a literal one is resolved once at start-up and then 502s.
    # NGINX_RESOLVER is Docker's embedded DNS (127.0.0.11) in the web image; a bare-host nginx sets its own.
    resolver ${NGINX_RESOLVER} valid=10s ipv6=off;
    set $api_upstream http://${API_UPSTREAM};
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
  }

  # The website chat widget (module 37, built by vite.widget.config.ts into /widget/chat.js) is loaded by brokerages'
  # own websites with a plain <script src>, a cross-origin no-cors request: this one path sends
  # Cross-Origin-Resource-Policy: cross-origin (widget-security-headers.conf, generated from widgetScriptHeaders);
  # every other location stays same-origin. Its name is not hashed, so it is cached briefly and revalidated, and a
  # missing file is a 404, never the SPA's index.html (which nosniff would refuse to run anyway). The widget's calls
  # go to /api/public/chat/ below, where the API answers CORS itself.
  location = /widget/chat.js {
    add_header Cache-Control "public, max-age=300";
    include /etc/nginx/snippets/widget-security-headers.conf;
    try_files $uri =404;
  }

  # hashed assets are immutable; index.html never cached so a deploy is picked up at once
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  location / {
    # the SPA fallback is an internal redirect to /index.html, which this location serves with the same headers
    add_header Cache-Control "no-store";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
