# The optional TLS edge of docker-compose.app-vm.yml (profile `edge`, docs/DEPLOY.md §12): mounted over the
# nginx image's /etc/nginx/conf.d/default.conf, it terminates TLS for app.example.com and hands every request to the
# web container, which serves the app and proxies /api (deploy/nginx.conf).
#
# No logs, for the same reasons as deploy/nginx.conf:7-24: capability URLs carry their secret in the path (invite,
# chat session, unsubscribe, intake, marketing-image tokens) and query strings can carry PII, and nginx writes the
# raw request line into every error record about a request. With no access log and no error log here, a new
# capability path needs no change in this file. The web container's access log (redacted) is the request record.
# nginx's own start-up messages still go to stderr. There is deliberately no log_format in this file.
access_log off;
error_log /dev/null;
server_tokens off;

# Any other name, or a bare IP: no answer. 444 closes the connection; on 443 the handshake is refused before a
# certificate is shown, so the edge never reveals its name to a scanner.
server {
  listen 80 default_server;
  listen 443 ssl default_server;
  ssl_reject_handshake on;
  return 444;
}

server {
  listen 80;
  server_name app.example.com;
  return 301 https://$server_name$request_uri;
}

server {
  listen 443 ssl;
  server_name app.example.com;

  ssl_certificate /etc/realty/tls/fullchain.pem;
  ssl_certificate_key /etc/realty/tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  # owner question 3: no includeSubDomains and no preload yet
  add_header Strict-Transport-Security "max-age=31536000" always;

  # webhooks (up to 10 MB) and imports, as in deploy/nginx.conf
  client_max_body_size 11m;

  location / {
    # the API sends its own HSTS (helmet): keep exactly one header, this one
    proxy_hide_header Strict-Transport-Security;
    proxy_set_header Host $host;
    # the client's address, REPLACING any X-Forwarded-For the client wrote (never appended): the web container's
    # real-ip.conf believes this hop because it is on the compose network (chat-xff-ratelimit-bypass)
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    # a literal upstream is resolved once at start-up: restart the edge after the web container is recreated
    proxy_pass http://web:8080;
  }
}
