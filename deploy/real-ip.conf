# The client's address behind the TLS-terminating load balancer (finding chat-xff-ratelimit-bypass). Included by the
# server block of deploy/nginx.conf; the Dockerfile `web` stage copies it to /etc/nginx/snippets/real-ip.conf.
#
# nginx believes X-Forwarded-For only from the hops listed here and takes, from the right, the first address that
# is not one of them (real_ip_recursive): the client as the load balancer saw it, however many addresses the
# client itself wrote in front. That becomes $remote_addr, which /api/ hands to the API as the ONLY X-Forwarded-For
# entry (the API's per-IP limits and the audit IP; TRUST_PROXY names this container) and the access log writes.
# A client that reaches nginx directly is not a listed hop: its own address is used and its header is ignored.
#
# The defaults are the private, loopback and link-local ranges: a load balancer in a VPC or a TLS proxy on the
# Docker host connects from one of them. An edge with PUBLIC addresses (a CDN in front of nginx) lists its own
# published ranges here instead (mount a file over this one); never 0.0.0.0/0, which would let every client
# choose its address. apps/web/src/security-headers.nginx.test.ts refuses anything outside these ranges.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.0/8;
set_real_ip_from 169.254.0.0/16;
set_real_ip_from fc00::/7;
set_real_ip_from fe80::/10;
set_real_ip_from ::1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
