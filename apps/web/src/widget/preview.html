<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Chat widget preview</title>
    <style>
      body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: Canvas; color: CanvasText; }
      main { max-width: 40rem; padding: 24px 16px 96px; }
    </style>
  </head>
  <body>
    <!-- A stand-in for a brokerage's website (dev, e2e and the accessibility sweep). It loads the widget the way a
         brokerage's site does, with a real widget key from its own address: ?key=wk_… (a key from
         POST /admin/web-chat/widgets), and optionally ?api= for another API base (default: this origin's /api). The
         e2e stacks open it on another origin than the API, so every chat call is a real cross-origin request. -->
    <main>
      <h1>Chat widget preview</h1>
      <p>This page stands in for a brokerage's own website. The chat button is the Realty OS widget.</p>
      <p id="no-key" hidden>Add <code>?key=</code> and a widget key to this page's address to load the widget.</p>
    </main>
    <script type="module">
      const q = new URLSearchParams(location.search);
      const key = q.get('key');
      if (key) {
        const s = document.createElement('script');
        s.type = 'module';
        s.src = new URL('./main.ts', import.meta.url).href;
        s.dataset.widgetKey = key;
        s.dataset.api = q.get('api') || '/api';
        document.body.append(s);
      } else {
        document.getElementById('no-key').hidden = false;
      }
    </script>
  </body>
</html>
